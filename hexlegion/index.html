<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hex Legion</title>
<meta name="description" content="Hex Legion: forma tu legión de campeones en un tablero de hexágonos y lánzate a la batalla. iPhone y Android." />
<meta property="og:title" content="Hex Legion" />
<meta property="og:description" content="Auto-batallas tácticas en hexágonos. iPhone y Android." />
<meta property="og:image" content="https://pacomar.github.io/hexlegion/icon.png" />
<meta name="theme-color" content="#4e2c17" />
<link rel="icon" href="icon.png" />
<link rel="apple-touch-icon" href="icon.png" />
<style>
  :root { --ink: #3d2213; --ink2: #7a5a40; --gold: #ffc23d; --card: #fff8ec; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; font-family: ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink);
    background: radial-gradient(80% 60% at 50% 30%, #ffe9a8, #f7b84a 50%, #8a4a18); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 380px; background: var(--card); border: 4px solid var(--gold); border-radius: 28px; padding: 28px 22px 22px; text-align: center; box-shadow: 0 8px 0 #6b3a0f, 0 20px 40px #0004; }
  .icon { width: 112px; height: 112px; border-radius: 26px; display: block; margin: -84px auto 10px; border: 4px solid var(--gold); box-shadow: 0 5px 0 #6b3a0f; }
  h1 { font-size: 34px; margin: 4px 0 2px; }
  .tag { color: var(--ink2); font-size: 16px; margin: 0 0 18px; }
  .btn { display: block; text-decoration: none; font-weight: 700; font-size: 18px; color: #fff; padding: 14px 16px; border-radius: 18px; margin: 10px 0; }
  .btn small { display: block; font-size: 12px; font-weight: 600; opacity: .85; }
  .ios { background: var(--ink); box-shadow: 0 5px 0 #1e100a; }
  .android { background: #4fae3e; box-shadow: 0 5px 0 #2f7a24; }
  .soon { background: #b9a48a; box-shadow: 0 5px 0 #8a7458; pointer-events: none; }
  .foot { margin-top: 16px; font-size: 12px; color: var(--ink2); }
  .foot a { color: var(--ink2); }
</style>
</head>
<body>
  <main class="card">
    <img class="icon" src="icon.png" alt="Hex Legion" />
    <h1>Hex Legion</h1>
    <p class="tag">Forma tu legión, colócala en el tablero de hexágonos y deja que luche. Mejora a tus campeones, sube a la torre y compite en la arena.</p>
    <span class="btn ios soon">App Store<small>Muy pronto</small></span>
    <span class="btn android soon">Google Play<small>Muy pronto</small></span>
    <p class="foot"><a href="privacy.html">Política de privacidad</a> · <a href="mailto:francisco.mar.esp@gmail.com">Soporte</a> · <a href="../">PacoGames</a></p>
  </main>
</body>
</html>
